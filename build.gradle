subprojects {
    apply plugin: 'java'

    group = project.maven_group
    // CI passes -Pbuild_tag=<commit> so every downloaded jar is distinguishable, e.g. helios-0.1.2+4e47616.jar
    version = project.mod_version + (project.hasProperty('build_tag') ? "+${project.build_tag}" : '')

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
}
