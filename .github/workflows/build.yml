name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --stacktrace -Pbuild_tag=${GITHUB_SHA::7}

      - name: Name artifact after the jar
        run: |
          jar=$(ls fabric/build/libs/*.jar | grep -v -- -sources.jar)
          echo "ARTIFACT=$(basename "$jar" .jar)" >> "$GITHUB_ENV"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error
